<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #map {
            height: 400px;
            width: 50%;
        }
    </style>
</head>

<body>
    <div id="buscar">
        <input type="text" id="localBuscar"         placeholder="Digite um local">
        <button id="btnBuscar">Buscar</button>
    </div>
    <div id="map"></div>
    <div id="form">
        <input type="text" id="campoNome" placeholder="Informe o nome">
        <input type="text" id="campoDescricao" placeholder="Informe a descrição">
        <select id="campoTipo">
            <option value="Educação">Educação</option>
            <option value="Lazer">Lazer</option>
            <option value="Saúde">Saúde</option>
            <option value="Trabalho">Trabalho</option>
        </select>
        <button id="btnSalvar">Salvar</button>
    </div>
    <script>
        let center = [-6.8863, -38.5559];
        var map = L.map('map',{
            zoomControl: true
        }).setView(center, 14);
        let marker = L.marker(center,{
            draggable: true,
            opacity: 0.7,
            icon: L.icon({
                iconUrl: 'https://images.icon-icons.com/7373/PNG/512/403167_map_pin_plus_ve2ec473621.png',
                iconSize: [30, 30]
            })
        }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        map.locate();

        map.on('locationfound', e =>{
            map.setView(e.latlng);
            marker.setLatLng(e.latlng);
        });

        map.on('click', e=>{
            map.setView(e.latlng);
            marker.setLatLng(e.latlng);
        });

        const botaoBuscar = document.getElementById('btnBuscar');
        
        botaoBuscar.addEventListener('click', async ()=>{
            let localBuscar = document.getElementById('localBuscar').value;
            const url = 
            fetch(`https://nominatim.openstreetmap.org/search?q=${localBuscar}&format=json`)
                .then(response => response.json())
                .then(data =>{
                    if(data.length > 0){
                        const lat = data[0].lat;
                        const lon = data[0].lon;
                        map.setView([lat, lon], 14);
                        marker.setLatLng([lat, lon]);
                    } else {
                        alert('Local não encontrado');
                    }
                });
        });

        carregarPontos();

        async function carregarPontos(){
            fetch('https://aplicacao-poi.onrender.com/pois')
                .then(response => response.json())
                .then(data =>{
                    data.forEach(ponto =>{
                        const marker = L.marker(ponto.localizacao.coordinates)
                            .addTo(map);
                        marker.bindPopup(ponto.nome)
                    });
                });
        }

        const botaoSalvar = document.getElementById('btnSalvar');
        botaoSalvar.addEventListener('click', async ()=>{
            let nome = document.getElementById('campoNome').value;
            let descricao = document.getElementById('campoDescricao').value;
            let tipo = document.getElementById('campoTipo').value;
            let localizacao = {
                type: 'Point',
                coordinates: [marker.getLatLng().lat, marker.getLatLng().lng]
            }
            const ponto = {
                nome,
                descricao,
                tipo,
                localizacao
            }
            console.log(JSON.stringify(ponto));
        });

    </script>
</body>

</html>
